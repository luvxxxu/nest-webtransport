name: Release validation

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        node: [24.20.0, 26.x]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - run: bunx playwright install --with-deps chromium
      - run: bun run release:check
      - run: bun audit

  production-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production image from a clean checkout
        run: docker build --file examples/production/Dockerfile --tag nest-webtransport-production:ci .
      - name: Verify image runtime and installed modules
        run: >-
          docker run --rm --workdir /app/examples/production --entrypoint node nest-webtransport-production:ci
          --input-type=module -e
          "import 'reflect-metadata';
          import { AppModule } from './dist/app.module.js';
          import { createClient } from 'redis';
          if (Number(process.versions.node.split('.')[0]) !== 26 || typeof AppModule.register !== 'function' || typeof createClient !== 'function') process.exit(1);"
